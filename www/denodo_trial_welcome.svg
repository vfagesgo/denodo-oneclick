d securely</text><text x="836" y="650" class="copy">share governed data products.</text><rect x="836" y="685" width="297" height="36" rx="7" fill="#176bd6"/><text x="984.5" y="708" text-anchor="middle" class="btn">Start tour</text><rect x="1185" y="540" width="337" height="190" rx="18" fill="#fff" stroke="#dce5f1" filter="url(#shadow)"/><circle cx="1230" cy="582" r="25" fill="#f0ebff"/><use xlink:href="#bot" x="1214" y="566" width="32" height="32" color="#7547e8"/><text x="1272" y="579" class="ct" font-size="17">AWS SageMaker &amp;</text><text x="1272" y="601" class="ct" font-size="17">Denodo MCP</text><text x="1205" y="632" class="copy">Deploy trusted AI Agents faster with</text><text x="1205" y="650" class="copy">Denodo and AWS Sagemaker.</text><rect x="1205" y="685" width="297" height="36" rx="7" fill="#176bd6"/><text x="1353.5" y="708" text-anchor="middle" class="btn">Start tour</text><text x="80" y="786" class="section">Tools direct access</text><rect x="78" y="810" width="1444" height="112" rx="16" fill="#f7f9fc" stroke="#e5ebf3"/><use xlink:href="#cube" x="125" y="849" width="32" height="32" color="#43536d"/><text x="170" y="872" class="tool">Design Studio</text><use xlink:href="#grid" x="410" y="849" width="32" height="32" color="#43536d"/><text x="455" y="872" class="tool">Data Marketplace</text><use xlink:href="#sparkle" x="695" y="849" width="32" height="32" color="#43536d"/><text x="740" y="872" class="tool">AI Chatbot</text><use xlink:href="#link" x="980" y="849" width="32" height="32" color="#43536d"/><text x="1025" y="872" class="tool">MCP &amp; API</text><use xlink:href="#book" x="1265" y="849" width="32" height="32" color="#43536d"/><text x="1310" y="872" class="tool">Documentation</text></svg>